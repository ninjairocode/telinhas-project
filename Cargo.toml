[workspace]
resolver = "2"
members = ["crates/telinhas-core", "crates/telinhas", "crates/telinhas-gui"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ninjairocode <ninjairocode@outlook.com>"]
repository = "https://github.com/ninjairocode/telinhas-project"
homepage = "https://github.com/ninjairocode/telinhas-project"

[profile.release]
lto = "thin"
strip = true

# Codificar/decodificar imagens sem otimização deixa testes e `cargo run`
# lentos demais.
[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
