# Flatpak manifest for Telinhas.
#
# Local build (from the repository root):
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.ninjairocode.Telinhas.yml
#
# For Flathub, replace the `dir` source below with a `git` source pointing to a
# release tag and its commit.
id: io.github.ninjairocode.Telinhas
runtime: org.freedesktop.Platform
runtime-version: '26.08'
base: com.system76.Cosmic.BaseApp
base-version: stable
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: telinhas-gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The mini screens are USB HID devices (/dev/hidraw*); access still needs
  # the udev rule installed on the host (see README).
  - --device=all
  # COSMIC theme and settings.
  - --talk-name=com.system76.CosmicSettingsDaemon
  - --filesystem=xdg-config/cosmic:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: telinhas
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/telinhas/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose -p telinhas-gui -p telinhas
      - install -Dm0755 target/release/telinhas-gui /app/bin/telinhas-gui
      - install -Dm0755 target/release/telinhas /app/bin/telinhas
      - install -Dm0644 packaging/io.github.ninjairocode.Telinhas.desktop /app/share/applications/io.github.ninjairocode.Telinhas.desktop
      - install -Dm0644 packaging/io.github.ninjairocode.Telinhas.metainfo.xml /app/share/metainfo/io.github.ninjairocode.Telinhas.metainfo.xml
      - cp -r packaging/icons /app/share/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-dir
          - .flatpak-builder
      - cargo-sources.json
